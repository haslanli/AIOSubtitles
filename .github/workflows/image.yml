# The AIOSubtitles image for x86 (amd64) and ARM (arm64), built on GitHub's own machines of each kind. The image's
# tests run inside its build, and the image is published to ghcr.io only when every test on both has passed:
# :main for each push to main; :X.Y.Z, :X.Y and :latest (for the highest version) for each release tag vX.Y.Z;
# only :X.Y.Z-rc.N for a release candidate's tag vX.Y.Z-rc.N, so it can be tested before :latest moves.
# Pull requests are only built and tested. The architecture jobs are in image-build.yml.
name: image

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Installer tests and version rules
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Installer tests (this workflow's own rules included)
        run: python3 -m unittest discover -s installer/tests -t .
      - name: Version rules
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must be three numbers, like 1.3.0"; exit 1
          fi
          case "$REF" in
            refs/tags/*)
              # a release tag is v + the VERSION of its commit; a release candidate's adds -rc.N
              if [ "$REF_NAME" != "v$version" ] && ! [[ "$REF_NAME" =~ ^v${version//./\\.}-rc\.[0-9]+$ ]]; then
                echo "::error::The tag doesn't match VERSION ($version)"; exit 1
              fi ;;
            refs/heads/main)
              # the image is built from subsync/ and installer/: a change there needs a new VERSION and its release tag
              if [ "$EVENT" = push ] && git rev-parse -q --verify "refs/tags/v$version" > /dev/null \
                 && ! git diff --quiet "v$version" HEAD -- subsync/ installer/ .dockerignore; then
                echo "::error::The image's files changed since v$version: raise VERSION"; exit 1
              fi ;;
          esac
          echo "VERSION $version"

  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
    uses: ./.github/workflows/image-build.yml
    with:
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      publish: false

  # Publishing starts only after the installer tests and both architectures' tests have passed, and only for a push
  # to main or a release tag. Each architecture is pushed by digest, without a tag; the manifest job tags them.
  publish-amd64:
    name: Publish amd64
    needs: [checks, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image-build.yml
    with:
      arch: amd64
      runner: ubuntu-24.04
      publish: true

  publish-arm64:
    name: Publish arm64
    needs: [checks, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image-build.yml
    with:
      arch: arm64
      runner: ubuntu-24.04-arm
      publish: true

  manifest:
    name: Multi-arch image and tags
    needs: [publish-amd64, publish-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Image name, and whether this is the highest version
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "image=ghcr.io/${OWNER,,}/aiosubtitles" >> "$GITHUB_OUTPUT"
          newest=false
          if [[ "$REF" == refs/tags/v* ]]; then
            top="$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
            if [ "$top" = "$REF_NAME" ]; then newest=true; fi
          fi
          echo "newest=$newest" >> "$GITHUB_OUTPUT"
      - name: Tags and annotations
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.name.outputs.newest == 'true' }}
          annotations: |
            org.opencontainers.image.title=AIOSubtitles
            org.opencontainers.image.description=AIOSubtitles: synced subtitles for AIOStreams
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.39.0
          driver: docker
      - name: A published version never changes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -uo pipefail
          if out="$(docker buildx imagetools inspect "$IMAGE:$VERSION" 2>&1)"; then
            echo "::error::$VERSION is already published; a fix needs a new version"; exit 1
          elif ! grep -qiE 'not found|manifest unknown' <<< "$out"; then
            echo "::error::Couldn't check whether $VERSION is already published"; echo "$out" | tail -n 5; exit 1
          fi
      - name: Create the multi-arch image
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          AMD64: ${{ needs.publish-amd64.outputs.digest }}
          ARM64: ${{ needs.publish-arm64.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
        run: |
          set -euo pipefail
          for d in "$AMD64" "$ARM64"; do
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::A digest is missing"; exit 1; }
          done
          args=()
          while IFS= read -r t; do [ -n "$t" ] && args+=(--tag "$t"); done <<< "$TAGS"
          [ "${#args[@]}" -gt 0 ] || { echo "::error::No tag to publish"; exit 1; }
          while IFS= read -r a; do [ -n "$a" ] && args+=(--annotation "$a"); done <<< "$ANNOTATIONS"
          # first without pushing: both platforms and their provenance and SBOM must be in it, or nothing is tagged
          docker buildx imagetools create --dry-run "${args[@]}" "$IMAGE@$AMD64" "$IMAGE@$ARM64" | python3 -c '
          import json, sys
          index = json.load(sys.stdin)
          found = [m.get("platform", {}) for m in index["manifests"]]
          images = sorted(p.get("architecture") for p in found if p.get("os") == "linux")
          proofs = [m for m in index["manifests"]
                    if m.get("annotations", {}).get("vnd.docker.reference.type") == "attestation-manifest"]
          print("platforms:", images, "attestation manifests:", len(proofs))
          sys.exit(0 if images == ["amd64", "arm64"] and len(proofs) == 2 else 1)'
          docker buildx imagetools create "${args[@]}" "$IMAGE@$AMD64" "$IMAGE@$ARM64"
          docker buildx imagetools inspect "$(head -n 1 <<< "$TAGS")"
